<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maa Ambe Jewellers</title>
    <link rel="stylesheet" href="style.css">
    <!-- Supabase JS SDK v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Auth Modal -->
    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <h2>Maa Ambe Jewellers</h2>
            <p>Login with OTP</p>
            <form id="signupForm" onsubmit="handleSignup(event)">
                <input type="text" id="userNameInput" placeholder="Enter Your Name" required>
                <input type="tel" id="userContactInput" placeholder="Enter Phone (+91...)" required>
                <button type="submit" class="btn-primary">Get OTP</button>
            </form>
        </div>
    </div>

    <!-- Main UI -->
    <div id="mainApp" style="display:none;">
        <header class="app-header">
            <div class="user-info">
                <span id="displayUserName">User</span>
                <div class="mudra-badge">
                    Mudra Gold: <strong id="displayMudraGold">0</strong>
                </div>
            </div>
            <button onclick="handleLogout()" class="btn-logout">Logout</button>
        </header>

        <main class="content-container">
            <h3>Products</h3>
            <div id="productGrid" class="product-grid"></div>
        </main>

        <!-- Booking Modal -->
        <div id="checkoutModal" class="modal-overlay" style="display:none;">
            <div class="modal-content">
                <div id="checkoutStep1">
                    <h3>Confirm Order</h3>
                    <p id="bookingProductName"></p>
                    <p id="bookingProductPrice"></p>
                    <button onclick="executeSureBooking()" class="btn-primary">Confirm & Claim Coins</button>
                    <button onclick="closeCheckoutModal()" class="btn-secondary">Cancel</button>
                </div>
                <div id="checkoutStep2" style="display:none;">
                    <h3>Order Confirmed!</h3>
                    <p>Your booking has been synced with Supabase.</p>
                    <button onclick="closeCheckoutModal()" class="btn-primary">Done</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Linked directly to app.js -->
    <script src="app.js"></script>
</body>
</html>
